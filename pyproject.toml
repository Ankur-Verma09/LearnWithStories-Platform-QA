[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-with-stories-platform-qa"
version = "1.0.0"
description = "End-to-end release validation for a Cloudflare Worker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-html==4.1.1",
]

[project.scripts]
cf-release = "cloudflare_qa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "live: changes the isolated Cloudflare QA Worker",
]

